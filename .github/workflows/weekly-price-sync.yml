name: Egypt Limo Weekly Price Feed Sync

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (02:00 Cairo Time)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Weekly Prices from Egypt Limo Partner API
        env:
          EGYPTLIMO_PARTNER_API_HOST: ${{ secrets.EGYPTLIMO_PARTNER_API_HOST }}
          EGYPTLIMO_CLIENT_ID: ${{ secrets.EGYPTLIMO_CLIENT_ID }}
          EGYPTLIMO_CLIENT_SECRET: ${{ secrets.EGYPTLIMO_CLIENT_SECRET }}
          EGYPTLIMO_MERCHANT_ID: ${{ secrets.EGYPTLIMO_MERCHANT_ID }}
          EGYPTLIMO_KEY_ID: ${{ secrets.EGYPTLIMO_KEY_ID }}
          EGYPTLIMO_SIGNING_SECRET: ${{ secrets.EGYPTLIMO_SIGNING_SECRET }}
        run: npm run sync:prices

      - name: Commit and Push if prices updated
        run: |
          git config --local user.email "bot@cairoairporttransfers.com"
          git config --local user.name "Egypt Limo Price Bot"
          if [ -n "$(git status --porcelain src/data/price-feed.json)" ]; then
            git add src/data/price-feed.json
            git commit -m "chore(prices): auto-sync weekly route price feed [skip ci]"
            git push
          else
            echo "No price changes detected this week."
          fi
